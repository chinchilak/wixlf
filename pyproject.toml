[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wixlf"
version = "0.1.1"
description = "Write Into XLSX Files — constant-memory, multiprocess streaming writer for existing .xlsx/.xlsm workbooks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "chinchilak" },
]
keywords = ["excel", "xlsx", "xlsm", "lxml", "streaming", "openpyxl", "wixlf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "lxml>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/chinchilak/wixlf"
Issues = "https://github.com/chinchilak/wixlf/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wixlf"]
